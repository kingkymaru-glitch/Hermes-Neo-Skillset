name: searxng-review

services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_PORT=8080
      - SEARXNG_BIND_ADDRESS=0.0.0.0
    cpus: 1.0
    mem_limit: 512M
    memswap_limit: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
