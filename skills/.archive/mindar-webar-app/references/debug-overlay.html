<!-- Copy this debug scaffold into any MindAR AR page (setup.html / viewer.html).
     Ends the headless "guess-fix-test" loop: the user's next report carries the
     exact failing step instead of "it's stuck". Proven this session (2026-08-23). -->

<!-- 1. CSS + HTML elements (put in <head> / <body>) -->
<style>
  #dbgToggle{position:fixed;top:8px;right:8px;z-index:9999;background:#222;color:#9f9;border:1px solid #555;
             border-radius:6px;padding:.3rem .6rem;font-size:.75rem}
  #dbg{display:none;position:fixed;top:40px;right:0;width:80%;max-height:65%;overflow:auto;
       background:rgba(0,0,0,.82);color:#9f9;font:11px/1.45 monospace;padding:.4rem;z-index:9998}
  #dbg .line.err{color:#f77}
  #dbg .line.ok{color:#7f7}
  #rawVideo{display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:90;background:#000}
</style>

<button id="dbgToggle">debug</button>
<div id="dbg"><div id="dbgLog"></div></div>
<video id="rawVideo" playsinline webkit-playsinline muted></video>

<!-- 2. Script (after ar-core.js + a-scene are in the DOM) -->
<script>
  const dbgLog = document.getElementById('dbgLog');
  const dbg = (msg, cls) => {
    const d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = `[${new Date().toISOString().slice(11,19)}] ${msg}`;
    dbgLog.appendChild(d); dbgLog.scrollTop = dbgLog.scrollHeight; console.log('ARDBG', msg);
  };
  window.addEventListener('error', (e) => dbg('WINDOW ERROR: ' + (e.message||e.error) + (e.filename?(' @'+e.filename+':'+e.lineno):''), 'err'));
  window.addEventListener('unhandledrejection', (e) => dbg('UNHANDLED REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'err'));
  document.getElementById('dbgToggle').addEventListener('click', () => {
    const el = document.getElementById('dbg');
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
  });
  dbg('script loaded');

  const sceneEl = document.querySelector('a-scene');
  if (sceneEl) {
    sceneEl.addEventListener('loaded', () => dbg('a-scene LOADED', 'ok'));
    if (sceneEl.hasLoaded) dbg('a-scene already loaded', 'ok');
  }

  // Raw camera test — bypasses MindAR, isolates hardware/permission from MindAR init.
  document.getElementById('rawTest')?.addEventListener('click', async () => {
    dbg('raw camera test: getUserMedia…');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = document.getElementById('rawVideo');
      v.srcObject = stream; v.style.display = 'block'; await v.play();
      dbg('raw camera OK — hardware works', 'ok');
      setTimeout(() => { stream.getTracks().forEach(t => t.stop()); v.style.display='none'; }, 8000);
    } catch (e) { dbg('raw camera FAILED: ' + e.name + ' ' + e.message, 'err'); }
  });

  // Gate start() on scene loaded (silent-hang source otherwise)
  document.getElementById('startBtn').addEventListener('click', async () => {
    dbg('start clicked');
    try {
      if (!sceneEl) throw new Error('a-scene missing');
      if (!sceneEl.hasLoaded) {
        dbg('waiting for a-scene loaded…');
        await new Promise((res) => {
          if (sceneEl.hasLoaded) return res();
          sceneEl.addEventListener('loaded', res, { once: true });
          setTimeout(res, 8000);
        });
        dbg('scene ready, calling mindar start()');
      }
      const sys = sceneEl.systems['mindar-image-system'];
      if (!sys) throw new Error('mindar-image-system not found');
      dbg('calling start()…');
      await sys.start();
      dbg('start() resolved — scanning', 'ok');
    } catch (e) { dbg('start FAILED: ' + e.message, 'err'); }
  });

  document.getElementById('target')?.addEventListener('targetFound', () => dbg('targetFound fired', 'ok'));
  document.getElementById('target')?.addEventListener('targetLost', () => dbg('targetLost'));
</script>
